# application-mock.yml
# Zero-dependency mock profile — runs with H2 in-memory DB.
# No PostgreSQL, no Redis, no Kafka, no MinIO, no Elasticsearch, no Twilio, no WhatsApp, no Razorpay needed.

spring:

  # ===== Database — H2 in-memory mode compatible with PostgreSQL =====
  datasource:
    url: ${DB_URL:jdbc:h2:mem:quickserve;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  # ===== Redis — disabled, replaced by InMemoryOtpStore =====
  data:
    redis:
      host: localhost
      port: 6379

  # ===== Kafka — disabled, replaced by MockEventPublisher =====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 1000

  # ===== Autoconfigure: disable Redis, Kafka, ES, Mail auto-config =====
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  # ===== Mail — no-op in mock =====
  mail:
    host: localhost
    port: 2525

quickserve:
  # ===== JWT — fixed dev secret =====
  jwt:
    secret: mock-profile-secret-key-minimum-256-bits-long-for-hmac-sha256-algorithm
    access-token-expiry-ms: 86400000    # 24h so you don't keep logging in during dev
    refresh-token-expiry-ms: 604800000  # 7 days

  # ===== Mock flags =====
  mock:
    enabled: true
    otp-bypass-code: "123456"
    seed-demo-data: true

  # ===== External services — all disabled =====
  minio:
    endpoint: http://localhost:9000
    access-key: mock
    secret-key: mock
    bucket-name: quickserve

  whatsapp:
    graph-api-url: http://localhost:0      # never reached in mock
    webhook-verify-token: mock-token
    encryption-key: mock-32-char-key-padded-to-32chars!

  razorpay:
    key-id: mock_key
    key-secret: mock_secret
    webhook-secret: mock_webhook_secret

  twilio:
    account-sid: mock_sid
    auth-token: mock_token
    from-number: "+10000000000"

  app:
    base-url: http://localhost:5173
    trial-days: 14

logging:
  level:
    com.quickserve: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
